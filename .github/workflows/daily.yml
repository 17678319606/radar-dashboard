name: 雷达日报每日自动更新

# 每天 06:00 / 19:00（北京时间）自动跑一次：采集信号 → DeepSeek 生成日报 → 构建数据 → 提交回仓库
# 站点外壳（EdgeOne 上的 dist/）只需部署一次，数据从此处每日自动变，无需重新部署、不依赖 WorkBuddy
on:
  schedule:
    - cron: "0 22 * * *"   # 北京 06:00 = UTC 22:00
    - cron: "0 11 * * *"   # 北京 19:00 = UTC 11:00
  workflow_dispatch:       # 允许在 Actions 页面手动点一下触发

permissions:
  contents: write

concurrency:
  group: radar-daily
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 采集信号 + DeepSeek 生成日报 + 构建数据
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL || 'https://api.deepseek.com/v1' }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
        run: bash update.sh

      - name: 同步数据到仓库根 radar-api/（前端 raw.githubusercontent 拉的就是这里）
        run: |
          set -e
          test -d dist/radar-api || { echo "::error::dist/radar-api 不存在，构建失败"; exit 1; }
          rm -rf radar-api
          cp -r dist/radar-api radar-api
          echo "已同步文件数：$(find radar-api -type f -name '*.json' | wc -l)"
          test -f radar-api/reports.json || { echo "::error::radar-api/reports.json 缺失"; exit 1; }

      - name: 校验数据新鲜度
        run: |
          set -e
          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          # reports.json 是报告摘要列表（按日期倒序），每个元素含 date 字段；
          # 取列表首元素（最新一期）的 date。兼容 dict 结构兜底，避免 TypeError。
          GEN=$(python3 -c "import json;d=json.load(open('radar-api/reports.json'));print(d[0]['date'] if isinstance(d,list) and d else (d.get('date','') if isinstance(d,dict) else ''))")
          if [ "$GEN" != "$TODAY" ]; then
            echo "::error::日报日期 $GEN ≠ 今天 $TODAY，自动更新可能失败"
            exit 1
          fi
          echo "✅ 日报日期与今天一致: $TODAY"

      - name: 提交更新的数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 仅提交必要产物：日报正文 / 独立开发者列表 / 去重状态 / 构建数据；
          # 排除 data/raw_signals（每日约 332KB，已由 radar-api/raw 承载，避免仓库无限膨胀）
          git add data/reports data/indie_dev.json data/daily_signals_state.json radar-api/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无数据变更，跳过提交"
          else
            git commit -m "chore: 每日自动更新 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git pull --rebase --autostash origin main || true
            git push
          fi

      - name: 验证 CDN 可达性（推送后端到端校验）
        run: |
          set -e
          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          URL="https://raw.githubusercontent.com/17678319606/radar-dashboard/main/radar-api/reports.json"
          for i in $(seq 1 6); do
            sleep 10
            GEN=$(curl -sL "$URL" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['date'] if isinstance(d,list) and d else '')" 2>/dev/null || true)
            if [ "$GEN" = "$TODAY" ]; then
              echo "✅ CDN 已可取到今日日报 ($TODAY)"
              exit 0
            fi
            echo "  第 $i 次：CDN 暂未更新（当前=$GEN），重试…"
          done
          echo "::error::推送后 60s 内 CDN 仍未提供今日日报，端到端更新可能失败"
          exit 1
